<div class="subscribe-footer">
  <a href="/disclaimer/" class="linktext-xs text-gray-500 hover:text-primary">Disclaimer</a>
</div>

<!-- Newsletter popup, kept off the monitoring funnel so it doesn't sit on top of the free-check CTAs.
     Decided client-side: PaperMod renders the footer with partialCached, so a per-page template check isn't reliable. -->
<script>
(function () {
  if (/^\/monitoring(?:\/|$)/.test(window.location.pathname)) return;
  var s = document.createElement('script');
  s.async = true;
  s.src = 'https://eocampaign1.com/form/fbc81a40-4aea-11f0-aff3-45842a94a714.js';
  s.setAttribute('data-form', 'fbc81a40-4aea-11f0-aff3-45842a94a714');
  document.body.appendChild(s);
})();
</script>

<!-- Consulting-funnel click tracking (GA4) -->
<script>
(function () {
  function track(eventName, params) {
    if (typeof window.gtag === 'function') {
      window.gtag('event', eventName, params);
    } else {
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push(Object.assign({ event: eventName }, params));
    }
  }
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (!a) return;
    var href = a.getAttribute('href') || '';
    var loc = a.getAttribute('data-cta') || window.location.pathname;
    var onExposureCheck = /\/monitoring\/free-exposure-check\/?$/.test(window.location.pathname);

    if (/calendly\.com/i.test(href)) {
      // Booking intent — the click through to Calendly. Mark as a Key Event in GA4.
      track('calendly_click', {
        cta_location: loc,
        link_url: href,
        page_path: window.location.pathname
      });
      if (onExposureCheck) {
        // Booking a call from the free-check page is a funnel conversion too.
        track('exposure_check_submit', {
          method: 'call',
          cta_location: loc,
          page_path: window.location.pathname
        });
      }
    } else if (/^mailto:/i.test(href) && (onExposureCheck || /exposure(?:%20|[+\s])*check/i.test(href))) {
      // Requesting the free credential-exposure check by email — the funnel conversion.
      track('exposure_check_submit', {
        method: 'email',
        cta_location: loc,
        page_path: window.location.pathname
      });
    } else if (/^mailto:/i.test(href) && /guardduty(?:%20|[+\s])*cost(?:%20|[+\s])*review/i.test(href)) {
      // Asking for the free GuardDuty cost review — a direct consulting lead.
      track('cost_review_request', {
        method: 'email',
        cta_location: loc,
        page_path: window.location.pathname
      });
    } else if (/\/consulting\/?(?:[?#]|$)/.test(href)) {
      // Mid-funnel — a post CTA sending the reader to the consulting page.
      track('consulting_cta_click', {
        cta_location: loc,
        page_path: window.location.pathname
      });
    }
  }, true);

  // People whose mailto doesn't open a mail app copy the address instead.
  // Count that as a free-check request too (once per pageview).
  var copyTracked = false;
  document.addEventListener('copy', function () {
    if (copyTracked) return;
    if (!/^\/monitoring\/(?:free-exposure-check\/?)?$/.test(window.location.pathname)) return;
    var sel = window.getSelection ? String(window.getSelection()) : '';
    if (!/javier@thehiddenport\.dev/i.test(sel)) return;
    copyTracked = true;
    track('exposure_check_submit', {
      method: 'copy_email',
      cta_location: window.location.pathname,
      page_path: window.location.pathname
    });
  });
})();
</script>
