{{/* Mid-post consulting CTA — injected via JS before the middle H2 */}}
<template id="mid-post-cta-template">
  <aside class="mid-post-cta">
    <div class="mid-post-cta-label">From Javier</div>
    <p class="mid-post-cta-text">
      If you'd rather have this done in your AWS environment than DIY it — that's what I do. Security audits, IAM hardening, GuardDuty and Security Hub deployment, ISO 27001 prep.
    </p>
    <a href="/consulting/" class="mid-post-cta-btn">Book a free 30-min intro call →</a>
  </aside>
</template>

<style>
  .mid-post-cta {
    margin: 2.5rem 0;
    padding: 1.25rem 1.5rem;
    border-left: 4px solid #f5a524;
    background: rgba(245, 165, 36, 0.08);
    border-radius: 0 6px 6px 0;
    font-family: var(--font);
  }
  .mid-post-cta-label {
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 700;
    color: #f5a524;
    margin-bottom: 0.5rem;
  }
  .mid-post-cta-text {
    font-size: 0.95rem;
    color: var(--secondary);
    margin: 0 0 1rem 0;
    line-height: 1.55;
  }
  .mid-post-cta-btn {
    display: inline-block;
    background: #f5a524;
    color: #1a1a1a !important;
    font-size: 0.9rem;
    font-weight: 700;
    padding: 0.6rem 1.1rem;
    border-radius: 6px;
    text-decoration: none;
    transition: opacity 0.15s ease;
  }
  .mid-post-cta-btn:hover {
    opacity: 0.88;
    text-decoration: none;
  }
</style>

<script>
(function() {
  document.addEventListener('DOMContentLoaded', function() {
    var content = document.querySelector('.post-content');
    if (!content) return;
    var headings = content.querySelectorAll('h2');
    if (headings.length < 3) return;
    var midIndex = Math.floor(headings.length / 2);
    var midHeading = headings[midIndex];
    var template = document.getElementById('mid-post-cta-template');
    if (template && midHeading && midHeading.parentNode) {
      var clone = template.content.cloneNode(true);
      midHeading.parentNode.insertBefore(clone, midHeading);
    }
  });
})();
</script>
